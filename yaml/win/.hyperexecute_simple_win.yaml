version: 0.1

runtime:
  language: node
  version: "18.20.8"

runson: win
maxRetries: 2
concurrency: 3
autosplit: true

pre:
  - npm install

cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules
testDiscovery:
  type: raw
  mode: remote
  command: |
    echo chrome
    echo firefox
    echo edge
testRunnerCommand: ./node_modules/.bin/nightwatch -e $test

jobLabel: [selenium-Nightwatch, win, autosplit-simple]