version: 0.1

runtime:
  language: node
  version: "18.20.8"

globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

retryOnFailure: true
runson: win
maxRetries: 2
concurrency: 3
autosplit: true

pre:
  - node -v
  - npm -v
  - npm install

cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

testDiscovery:
  type: raw
  mode: static
  command: |
    echo chrome
    echo firefox
    echo edge

testRunnerCommand: ./node_modules/.bin/nightwatch -e $test

uploadArtefacts:
  - name: Reports
    path:
      - reports/

jobLabel: [selenium-Nightwatch, win, autosplit, static-discovery]
