version: 0.1

runtime:
  language: node
  version: "18.20.8"

globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

runson: win

autosplit: true
retryOnFailure: true

maxRetries: 1
concurrency: 3
parallelism: 1

cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

pre:
  - node -v
  - npm -v
  - npm install

mergeArtifacts: true

uploadArtifacts:
  - name: Reports
    path:
      - reports/

report: true

partialReports:
  type: json
  location: reports/
  frameworkName: extent

testDiscovery:
  type: raw
  mode: remote
  command: |
    echo chrome
    echo firefox
    echo edge

testRunnerCommand: ./node_modules/.bin/nightwatch -e $test

jobLabel:
  - selenium-Nightwatch
  - win
  - autosplit